      <rect x="0" width="4" height="1024" fill="#080808" opacity="0.9"/>
      <rect x="10" width="3" height="1024" fill="#2a2a2a" opacity="0.45"/>
      <rect x="22" width="5" height="1024" fill="#050505" opacity="0.7"/>
